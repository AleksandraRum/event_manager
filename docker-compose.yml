services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: event_manager
      POSTGRES_USER: manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - events_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"

volumes:
  events_data: